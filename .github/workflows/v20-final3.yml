name: V20 three-regression validation
on:
  push:
    branches:
      - chatgpt/v20-business-page-import-hydration-20260807
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Focused V20 tests
        run: node --test test/v20-business-page-import-hydration.test.js test/v20-unified-business-state-realistic.test.js test/v20-same-date-history-preference.test.js
