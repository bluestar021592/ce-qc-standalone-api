name: Fix final patch template

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fix-final-patch-template.mjs'
      - '.github/workflows/fix-final-patch-template.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/fix-final-patch-template.mjs
      - shell: bash
        run: |
          if git diff --quiet -- scripts/apply-final-system-foundation.mjs; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-final-system-foundation.mjs
          git commit -m 'Fix final foundation patch template escaping'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
