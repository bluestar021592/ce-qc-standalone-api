name: V803 home proof and layout
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/v625-shell.html'
      - 'public/v625-shell.js'
      - 'public/v801-home-layout.css'
      - 'scripts/v803-home-proof-and-layout-smoke.mjs'
      - '.github/workflows/v803-home-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate timing regression and frontend
        run: |
          node --check public/v625-shell.js
          node --check scripts/v803-home-proof-and-layout-smoke.mjs
          node scripts/v803-home-proof-and-layout-smoke.mjs
          node scripts/v802-home-selected-timing-smoke.mjs
          node scripts/v801-home-timing-overview-smoke.mjs
          node scripts/v800-reference-ui-integration-smoke.mjs
