name: Apply final system foundation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-final-system-foundation.mjs'
      - '.github/workflows/apply-final-system-foundation.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-final-system-foundation.mjs
      - name: Commit final system foundation
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Finalize trajectory and shop state foundations'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
