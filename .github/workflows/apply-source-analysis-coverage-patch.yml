name: Apply source-analysis coverage patch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-source-analysis-coverage-patch.mjs'
      - '.github/workflows/apply-source-analysis-coverage-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-source-analysis-coverage-patch.mjs
      - name: Commit range coverage integration
        shell: bash
        run: |
          if git diff --quiet -- src/rangeDashboardStoreV31.js; then
            echo 'range coverage already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rangeDashboardStoreV31.js
          git commit -m 'Separate source totals from analyzed range outcomes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
