name: Split final range patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/trim-final-range-patches.mjs'
      - '.github/workflows/trim-final-range-patches.yml'

permissions:
  contents: write

jobs:
  split:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/trim-final-range-patches.mjs
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/apply-final-system-foundation.mjs
          git commit -m 'Split final range aggregation patch' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
