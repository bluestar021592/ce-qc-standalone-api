name: Apply Pending fact continuity

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-pending-fact-continuity.mjs'
      - '.github/workflows/apply-pending-fact-continuity.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-pending-fact-continuity.mjs
      - name: Commit Pending fact integration
        shell: bash
        run: |
          if git diff --quiet -- src/analyzerV30.js; then
            echo 'Pending fact continuity already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/analyzerV30.js
          git commit -m 'Use distinct trajectory dates for Pending continuity'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
