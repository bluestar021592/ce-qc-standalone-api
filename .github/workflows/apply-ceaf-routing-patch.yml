name: Apply CEAF routing patch

on:
  push:
    branches:
      - foundation/ceaf-ccsl-processing-20260809
    paths:
      - 'scripts/apply-ceaf-routing-patch.mjs'
      - '.github/workflows/apply-ceaf-routing-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-ceaf-routing-patch.mjs
      - name: Commit patched server routing
        shell: bash
        run: |
          if git diff --quiet -- server.js; then
            echo 'server.js already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Route CEAF through CCSL processing flow'
          git push origin HEAD:foundation/ceaf-ccsl-processing-20260809
