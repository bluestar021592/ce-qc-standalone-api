name: Apply CEAF routing patch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-ceaf-routing-patch.mjs'
      - '.github/workflows/apply-ceaf-routing-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-ceaf-routing-patch.mjs
      - name: Commit patched CEAF integration
        shell: bash
        run: |
          TARGETS='server.js src/lightweightDashboardStore.js src/rangeDashboardStoreV31.js src/rangeDashboardStoreLegacy.js'
          if git diff --quiet -- $TARGETS; then
            echo 'CEAF integration targets already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $TARGETS
          git commit -m 'Wire CEAF through CCSL processing and dashboard readers'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
