name: Apply trajectory facts patch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-trajectory-facts-patch.mjs'
      - '.github/workflows/apply-trajectory-facts-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/apply-trajectory-facts-patch.mjs
      - name: Commit analyzer integration
        shell: bash
        run: |
          if git diff --quiet -- src/analyzerV30.js; then
            echo 'trajectory facts already integrated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/analyzerV30.js
          git commit -m 'Use authoritative trajectory facts in analyzer'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
