name: V805 original reference homepage geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/v625-shell.html'
      - 'public/v625-shell.js'
      - 'public/v805-home-reference.css'
      - 'scripts/v800-reference-browser-render.mjs'
      - 'scripts/v804-workspace-layout-smoke.mjs'
      - '.github/workflows/v805-reference-home.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-preserving-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Layout, browser source and evidence regression
        run: |
          node --check public/v625-shell.js
          node --check scripts/v800-reference-browser-render.mjs
          node --check scripts/v804-workspace-layout-smoke.mjs
          node scripts/v804-workspace-layout-smoke.mjs
          node scripts/v800-reference-ui-integration-smoke.mjs
          node scripts/v801-home-timing-overview-smoke.mjs
          node scripts/v802-home-selected-timing-smoke.mjs
          node scripts/v803-home-proof-and-layout-smoke.mjs
