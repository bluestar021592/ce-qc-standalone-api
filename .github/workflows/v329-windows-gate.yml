name: V329 Windows go-live gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ce-qc-windows-golive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-golive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run managed-launcher go-live suite
        id: golive
        shell: pwsh
        continue-on-error: true
        run: |
          npm run test:golive *>&1 | Tee-Object -FilePath v329-golive.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($code -ne 0) { exit $code }
      - name: Upload go-live log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v329-windows-golive-log
          path: v329-golive.log
          if-no-files-found: warn
      - name: Enforce go-live result
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.golive.outcome }}' -ne 'success') { exit 1 }
