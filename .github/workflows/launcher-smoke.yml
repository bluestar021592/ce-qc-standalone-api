name: CE QC launcher smoke

on:
  pull_request:
    branches:
      - main

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Parse launcher scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('tools/CE_QC_Start.ps1','tools/Install_CE_QC_Desktop_Shortcut.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file))
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$file must remain ASCII-only for Windows PowerShell 5.1 compatibility"
            }
          }
          $runtimeTokens = $null
          $runtimeErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Start_CE_QC.ps1'), [ref]$runtimeTokens, [ref]$runtimeErrors) | Out-Null
          if ($runtimeErrors.Count -gt 0) {
            $runtimeErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Verify managed update launcher and protected runtime handoff
        shell: powershell
        run: |
          if (-not (Test-Path 'CE_QC_Start.bat')) { throw 'CE_QC_Start.bat missing' }
          if (-not (Test-Path 'Install_CE_QC_Desktop_Shortcut.bat')) { throw 'desktop installer missing' }
          if (-not (Test-Path 'Start_CE_QC.ps1')) { throw 'protected runtime Start_CE_QC.ps1 missing' }

          $text = Get-Content 'tools/CE_QC_Start.ps1' -Raw
          foreach ($required in @(
            'fetch','origin','main','reset','--hard','origin/main','node_modules','5177',
            'Get-PortOwnerPids','Stop-PortOwners','Stop-LegacySupervisors','Get-CimInstance','taskkill.exe','/T','/F',
            'Get-ShellSupervisorForProcess','Stop-RecordedRuntime','runtime_supervisor.pid','stable and free',
            'Verify-InstalledCandidate','Start_CE_QC.ps1','Get-FileHash','powershell.exe','--untracked-files=no','CE_QC_LAUNCHER_TEST_MODE'
          )) {
            if (-not $text.Contains($required)) { throw "launcher missing required token: $required" }
          }
          if ($text -match '(?m)^\s*elif\s*\(') {
            throw 'launcher contains bash/python-style elif; PowerShell requires elseif'
          }
          if ($text.Contains('Start-CeQcBackend')) {
            throw 'desktop update launcher must never own a second production backend supervisor'
          }
          $handoff = "& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path `$ProjectRoot 'Start_CE_QC.ps1')"
          if (-not $text.Contains($handoff)) {
            throw 'verified update must hand off final production runtime ownership to Start_CE_QC.ps1'
          }
          if ($text -match "stash','push','-u") {
            throw 'launcher must not stash/remove untracked local runtime or backup files'
          }
          foreach ($legacy in @('start_ce_qc.ps1','start_ce_qc.cmd','run_ce_qc_v18')) {
            if (-not $text.ToLowerInvariant().Contains($legacy)) { throw "launcher does not stop legacy supervisor token: $legacy" }
          }

          $runtime = Get-Content 'Start_CE_QC.ps1' -Raw
          foreach ($required in @(
            'runtime_supervisor.pid','Get-PortOwnerPids','Get-ShellSupervisor','Clear-CeQcPort','taskkill.exe','/T','/F',
            'EADDRINUSE','address already in use','Another old supervisor reclaimed port 5177','Port 5177 is stable and free',
            'Test-BackendProcessAlive','Get-BackendExitCode','Runtime supervisor monitor recovered from an internal error',
            'Backend is still running. Supervisor monitor will continue.'
          )) {
            if (-not $runtime.Contains($required)) { throw "protected runtime missing anti-race/monitor token: $required" }
          }
          if ($runtime.Contains('while (-not $Backend.HasExited)')) {
            throw 'protected runtime must not rely on the fragile Process.HasExited monitor loop'
          }

      - name: Verify V5 desktop shortcut installer contract
        shell: powershell
        run: |
          $installer = Get-Content 'tools/Install_CE_QC_Desktop_Shortcut.ps1' -Raw
          foreach ($required in @(
            'CE_QC_LAUNCHER','Launch_CE_QC.ps1','CE_EXPRESS_APP_V5.ico','CE QC APP.lnk',
            'New-Item -ItemType Junction','WScript.Shell','CreateShortcut','WindowStyle Hidden',
            'Start_CE_QC.ps1','127.0.0.1:5177','NO CMD window. NO VBS. NO Windows Script Host.'
          )) {
            if (-not $installer.Contains($required)) { throw "V5 installer missing required contract token: $required" }
          }
          foreach ($retired in @('EncodedCommand',':test_mode','Launch_CE_QC.cmd','Launch_CE_QC.vbs')) {
            if ($installer.Contains($retired) -and $retired -notin @('Launch_CE_QC.cmd','Launch_CE_QC.vbs')) {
              throw "V5 installer still depends on retired launcher contract: $retired"
            }
          }
          if (-not $installer.Contains("Remove-Item -LiteralPath (Join-Path `$LauncherRoot 'Launch_CE_QC.cmd')")) {
            throw 'V5 installer must remove stale CMD launcher'
          }
          if (-not $installer.Contains("Remove-Item -LiteralPath (Join-Path `$LauncherRoot 'Launch_CE_QC.vbs')")) {
            throw 'V5 installer must remove stale VBS launcher'
          }

      - name: Create and inspect Windows V5 desktop launcher
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/Install_CE_QC_Desktop_Shortcut.ps1'
          if ($LASTEXITCODE -ne 0) { throw "desktop installer exited with $LASTEXITCODE" }

          $launcherRoot = Join-Path $env:LOCALAPPDATA 'CE_QC_LAUNCHER'
          $hiddenLauncher = Join-Path $launcherRoot 'Launch_CE_QC.ps1'
          $appLink = Join-Path $launcherRoot 'app'
          $icon = Join-Path $launcherRoot 'CE_EXPRESS_APP_V5.ico'
          foreach ($requiredPath in @($hiddenLauncher,$appLink,$icon)) {
            if (-not (Test-Path -LiteralPath $requiredPath)) { throw "V5 launcher artifact missing: $requiredPath" }
          }
          $appItem = Get-Item -LiteralPath $appLink -Force
          if (($appItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0) {
            throw 'V5 app bridge must be a junction/reparse point'
          }

          $shell = New-Object -ComObject WScript.Shell
          $desktopCandidates = @()
          try { $desktopCandidates += [string]$shell.SpecialFolders.Item('Desktop') } catch {}
          try { $desktopCandidates += [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory) } catch {}
          if ($env:USERPROFILE) { $desktopCandidates += (Join-Path $env:USERPROFILE 'Desktop') }
          $shortcut = $null
          foreach ($desktop in ($desktopCandidates | Where-Object { $_ } | Select-Object -Unique)) {
            $candidate = Join-Path $desktop 'CE QC APP.lnk'
            if (Test-Path -LiteralPath $candidate) { $shortcut = $candidate; break }
          }
          if (-not $shortcut) { throw 'CE QC APP.lnk was not created on the resolved desktop' }

          $saved = $shell.CreateShortcut($shortcut)
          if ([string]$saved.TargetPath -notmatch 'powershell\.exe$') { throw "shortcut target is not PowerShell: $($saved.TargetPath)" }
          if ([string]$saved.Arguments -notlike '*-WindowStyle Hidden*Launch_CE_QC.ps1*') { throw "shortcut is not hidden V5 launcher: $($saved.Arguments)" }
          if ([string]$saved.Arguments -like '*Start_CE_QC.ps1*') { throw 'desktop shortcut must go through the ASCII hidden launcher instead of Unicode project path directly' }
          if ([string]$saved.IconLocation -notlike '*CE_EXPRESS_APP_V5.ico*') { throw "shortcut icon mismatch: $($saved.IconLocation)" }

          $hidden = Get-Content -LiteralPath $hiddenLauncher -Raw
          foreach ($required in @('Start_CE_QC.ps1','WindowStyle Hidden','127.0.0.1:5177','Test-CeQcReady')) {
            if (-not $hidden.Contains($required)) { throw "hidden launcher missing required token: $required" }
          }
          Write-Host 'V5 desktop launcher contract passed: .lnk -> hidden PowerShell -> ASCII junction -> protected Start_CE_QC.ps1'
