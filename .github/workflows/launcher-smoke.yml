name: CE QC launcher smoke

on:
  pull_request:
    branches:
      - main

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('tools/CE_QC_Start.ps1','tools/Install_CE_QC_Desktop_Shortcut.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file))
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$file must remain ASCII-only for Windows PowerShell 5.1 compatibility"
            }
          }
      - name: Verify stable launcher files and supervisor handoff
        shell: powershell
        run: |
          if (-not (Test-Path 'CE_QC_Start.bat')) { throw 'CE_QC_Start.bat missing' }
          if (-not (Test-Path 'Install_CE_QC_Desktop_Shortcut.bat')) { throw 'shortcut installer missing' }
          if (-not (Test-Path 'Start_CE_QC.ps1')) { throw 'protected runtime Start_CE_QC.ps1 missing' }
          $text = Get-Content 'tools/CE_QC_Start.ps1' -Raw
          foreach ($required in @(
            'fetch','origin','main','reset','--hard','origin/main','node_modules','5177',
            'Get-PortOwnerPids','Stop-PortOwners','Stop-LegacySupervisors','Get-CimInstance','taskkill.exe','/T','/F',
            'Start_CE_QC.ps1','Get-FileHash','powershell.exe','--untracked-files=no','elseif'
          )) {
            if (-not $text.Contains($required)) { throw "launcher missing required token: $required" }
          }
          if ($text -match '(?m)^\s*elif\s*\(') {
            throw 'launcher contains bash/python-style elif; PowerShell requires elseif'
          }
          if ($text.Contains("Start-CeQcBackend") -or $text.Contains("ArgumentList @('bootstrap.js')")) {
            throw 'desktop launcher must hand off to the protected Start_CE_QC.ps1 supervisor instead of launching Node directly'
          }
          if ($text -match "stash','push','-u") {
            throw 'launcher must not stash/remove untracked local runtime or backup files'
          }
          foreach ($legacy in @('start_ce_qc.ps1','start_ce_qc.cmd','run_ce_qc_v18')) {
            if (-not $text.ToLowerInvariant().Contains($legacy)) { throw "launcher does not stop legacy supervisor token: $legacy" }
          }
          $installer = Get-Content 'tools/Install_CE_QC_Desktop_Shortcut.ps1' -Raw
          foreach ($required in @('0x8D28','0x63A7','0x542F','0x52A8','CE_QC_Start.bat','cmd.exe','TargetPath','Arguments')) {
            if (-not $installer.Contains($required)) { throw "installer missing shortcut token: $required" }
          }
          if ($installer -match '\$Shortcut\.TargetPath\s*=\s*\$Launcher') {
            throw 'shortcut must not use a BAT file directly as WScript.Shell TargetPath'
          }
      - name: Create and verify Windows desktop shortcut
        shell: powershell
        run: |
          $tempDesktop = Join-Path $env:RUNNER_TEMP 'ce-qc-shortcut-test'
          New-Item -ItemType Directory -Path $tempDesktop -Force | Out-Null
          $env:CE_QC_SHORTCUT_DESKTOP = $tempDesktop
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/Install_CE_QC_Desktop_Shortcut.ps1'
          if ($LASTEXITCODE -ne 0) { throw "shortcut installer exited with $LASTEXITCODE" }
          $link = Get-ChildItem -LiteralPath $tempDesktop -Filter '*.lnk' | Select-Object -First 1
          if (-not $link) { throw 'shortcut installer did not create a .lnk file' }
          $shell = New-Object -ComObject WScript.Shell
          $saved = $shell.CreateShortcut($link.FullName)
          if (-not ([string]$saved.TargetPath).ToLowerInvariant().EndsWith('cmd.exe')) { throw "unexpected shortcut target: $($saved.TargetPath)" }
          if (-not ([string]$saved.Arguments).Contains('CE_QC_Start.bat')) { throw "shortcut arguments do not launch CE_QC_Start.bat: $($saved.Arguments)" }
          if (-not ([string]$saved.WorkingDirectory).Contains('ce-qc-standalone-api')) { throw "unexpected working directory: $($saved.WorkingDirectory)" }
