name: CE QC launcher smoke

on:
  pull_request:
    branches:
      - main

jobs:
  launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = @('tools/CE_QC_Start.ps1','tools/Install_CE_QC_Desktop_Shortcut.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file))
            if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$file must remain ASCII-only for Windows PowerShell 5.1 compatibility"
            }
          }
          $runtimeTokens = $null
          $runtimeErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Start_CE_QC.ps1'), [ref]$runtimeTokens, [ref]$runtimeErrors) | Out-Null
          if ($runtimeErrors.Count -gt 0) {
            $runtimeErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Verify stable launcher files and supervisor handoff
        shell: powershell
        run: |
          if (-not (Test-Path 'CE_QC_Start.bat')) { throw 'CE_QC_Start.bat missing' }
          if (-not (Test-Path 'Install_CE_QC_Desktop_Shortcut.bat')) { throw 'desktop installer missing' }
          if (-not (Test-Path 'Start_CE_QC.ps1')) { throw 'protected runtime Start_CE_QC.ps1 missing' }
          $text = Get-Content 'tools/CE_QC_Start.ps1' -Raw
          foreach ($required in @(
            'fetch','origin','main','reset','--hard','origin/main','node_modules','5177',
            'Get-PortOwnerPids','Stop-PortOwners','Stop-LegacySupervisors','Get-CimInstance','taskkill.exe','/T','/F',
            'Get-ShellSupervisorForProcess','Stop-RecordedRuntime','runtime_supervisor.pid','stable and free',
            'Start_CE_QC.ps1','Get-FileHash','powershell.exe','--untracked-files=no','CE_QC_LAUNCHER_TEST_MODE'
          )) {
            if (-not $text.Contains($required)) { throw "launcher missing required token: $required" }
          }
          if ($text -match '(?m)^\s*elif\s*\(') {
            throw 'launcher contains bash/python-style elif; PowerShell requires elseif'
          }
          if ($text.Contains("Start-CeQcBackend") -or $text.Contains("ArgumentList @('bootstrap.js')")) {
            throw 'desktop launcher must hand off to protected Start_CE_QC.ps1 instead of launching Node directly'
          }
          if ($text -match "stash','push','-u") {
            throw 'launcher must not stash/remove untracked local runtime or backup files'
          }
          foreach ($legacy in @('start_ce_qc.ps1','start_ce_qc.cmd','run_ce_qc_v18')) {
            if (-not $text.ToLowerInvariant().Contains($legacy)) { throw "launcher does not stop legacy supervisor token: $legacy" }
          }

          $runtime = Get-Content 'Start_CE_QC.ps1' -Raw
          foreach ($required in @(
            'runtime_supervisor.pid','Get-PortOwnerPids','Get-ShellSupervisor','Clear-CeQcPort','taskkill.exe','/T','/F',
            'EADDRINUSE','address already in use','Another old supervisor reclaimed port 5177','Port 5177 is stable and free',
            'Test-BackendProcessAlive','Get-BackendExitCode','Runtime supervisor monitor recovered from an internal error',
            'Backend is still running. Supervisor monitor will continue.'
          )) {
            if (-not $runtime.Contains($required)) { throw "protected runtime missing anti-race/monitor token: $required" }
          }
          if ($runtime.Contains('while (-not $Backend.HasExited)')) {
            throw 'protected runtime must not rely on the fragile Process.HasExited monitor loop'
          }

          $bat = Get-Content 'CE_QC_Start.bat' -Raw
          if ($bat.Contains('启动未完成')) {
            throw 'outer BAT must not print a misleading startup-failed message after the protected runtime has already been ready'
          }

          $installer = Get-Content 'tools/Install_CE_QC_Desktop_Shortcut.ps1' -Raw
          foreach ($required in @('0x8D28','0x63A7','0x542F','0x52A8','CE_QC_Start.ps1','EncodedCommand','.cmd','WriteAllLines','-NoExit','test_mode')) {
            if (-not $installer.Contains($required)) { throw "installer missing desktop CMD token: $required" }
          }
          if ($installer.Contains('CreateShortcut(')) {
            throw 'installer must not rely on WScript.Shell .lnk creation anymore'
          }
      - name: Create and actually execute Windows desktop launcher
        shell: powershell
        run: |
          $tempDesktop = Join-Path $env:RUNNER_TEMP 'ce-qc-desktop-launcher-test'
          New-Item -ItemType Directory -Path $tempDesktop -Force | Out-Null
          $env:CE_QC_SHORTCUT_DESKTOP = $tempDesktop
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/Install_CE_QC_Desktop_Shortcut.ps1'
          if ($LASTEXITCODE -ne 0) { throw "desktop installer exited with $LASTEXITCODE" }

          $launchers = @(Get-ChildItem -LiteralPath $tempDesktop -Filter '*.cmd')
          if ($launchers.Count -ne 1) { throw "expected exactly one desktop .cmd launcher, found $($launchers.Count)" }
          if ($launchers[0].Length -le 0) { throw 'desktop CMD launcher is empty' }
          if (@(Get-ChildItem -LiteralPath $tempDesktop -Filter '*.lnk').Count -ne 0) { throw 'legacy .lnk should not remain' }
          $cmdText = Get-Content -LiteralPath $launchers[0].FullName -Raw
          if (-not $cmdText.Contains('-NoExit')) { throw 'normal desktop launcher must keep PowerShell visible with -NoExit' }
          if (-not $cmdText.Contains(':test_mode')) { throw 'desktop launcher must contain CI test mode path' }

          $env:CE_QC_LAUNCHER_TEST_MODE = '1'
          $output = & cmd.exe /d /c ('"' + $launchers[0].FullName + '"') 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "desktop launcher exited with $LASTEXITCODE`n$output" }
          if (-not $output.Contains('CE_QC_LAUNCHER_TEST_OK')) {
            throw "desktop launcher did not reach CE_QC_Start.ps1`n$output"
          }
