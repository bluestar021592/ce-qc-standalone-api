name: V800 reference browser screenshot
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/v625-shell.html'
      - 'public/v625-shell.js'
      - 'public/v792-reference-ui.css'
      - 'scripts/v800-reference-browser-render.mjs'
      - '.github/workflows/v800-reference-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Render actual V800 home and WHPP reference UI without operational data
        run: node scripts/v800-reference-browser-render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v800-home-whpp-reference-ui-screenshots
          path: artifacts/v800-visual/*.png
          if-no-files-found: warn
          retention-days: 7
