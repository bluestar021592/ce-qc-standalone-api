name: V22 Memory Safe Dashboard Patch

on:
  push:
    branches:
      - chatgpt/v22-memory-safe-dashboard
    paths:
      - .github/workflows/v22-memory-safe-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v22-memory-safe-dashboard
          fetch-depth: 0

      - name: Apply V22 patch
        run: python3 .github/scripts/v22_range_patch.py

      - name: Static validation
        run: |
          node --check server.js
          node --check src/lightweightDashboardStore.js
          node --check src/lightweightDashboardSummary.js
          node --check src/periodExporter.js
          node --check public/app.js
          grep -q "loadLightweightPeriodBusinessState" server.js
          grep -q "listLightweightCompletedUnifiedSnapshots" src/periodExporter.js
          grep -q "dashboardRangeFrom" public/index.html
          grep -q "periodExportFrom" public/index.html
          grep -q "loadCustomDashboardRange" public/app.js
          grep -q "2026-08-08-v22-memory-safe-dashboard" server.js

      - name: Commit patch
        run: |
          git config user.name "ChatGPT V22"
          git config user.email "actions@users.noreply.github.com"
          git add server.js src/lightweightDashboardStore.js src/lightweightDashboardSummary.js src/periodExporter.js public/app.js public/index.html public/style.css
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "V22 fast dashboards and custom date range export"
          git push origin HEAD:chatgpt/v22-memory-safe-dashboard
