name: V22 Memory Safe Dashboard Patch

on:
  push:
    branches:
      - chatgpt/v22-memory-safe-dashboard
    paths:
      - .github/workflows/v22-memory-safe-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v22-memory-safe-dashboard
          fetch-depth: 0

      - name: Apply V22 patches
        run: |
          python3 .github/scripts/v22_range_patch.py
          python3 .github/scripts/v22_range_summary_patch.py
          python3 .github/scripts/v22_final_accuracy_patch.py

      - name: Static validation
        run: |
          node --check server.js
          node --check src/lightweightDashboardStore.js
          node --check src/lightweightDashboardSummary.js
          node --check src/rangeDashboardStore.js
          node --check src/periodExporter.js
          node --check public/app.js
          grep -q "loadRangeDashboard" server.js
          grep -q "SQL_AGGREGATE_ONLY" src/rangeDashboardStore.js
          grep -q "listLightweightCompletedUnifiedSnapshots" src/periodExporter.js
          grep -q "dashboardRangeFrom" public/index.html
          grep -q "periodExportFrom" public/index.html
          grep -q "loadCustomDashboardRange" public/app.js
          grep -q "result.aggregates?.CCSL" public/app.js
          grep -q "useSingleDayImportCounts" public/app.js
          grep -q "rangeBusinessCount('TBKH')" public/app.js
          grep -q "2026-08-08-v22-memory-safe-dashboard" server.js

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Runtime smoke test SQL range dashboard
        env:
          DATA_DIR: /tmp/ce-qc-v22-smoke
          DB_FILE: /tmp/ce-qc-v22-smoke/v22-smoke.db
        run: |
          rm -rf /tmp/ce-qc-v22-smoke
          node -e "import('./src/rangeDashboardStore.js').then(({loadRangeDashboard})=>{const r=loadRangeDashboard('2026-08-01','2026-08-08'); if(r.queryMode!=='SQL_AGGREGATE_ONLY') throw new Error('wrong query mode'); if(r.shipmentRowsTransferred!==0) throw new Error('shipment rows transferred'); if(!r.aggregates?.CCSL || !r.aggregates?.SHOPEE) throw new Error('missing aggregates'); console.log('V22 range SQL runtime smoke OK', r.fromDate, r.toDate);})"

      - name: Run all runnable project tests
        shell: bash
        run: |
          TEST_FILES=$(find test -maxdepth 1 -name '*.test.js' \
            ! -name 'unified-import-v7.test.js' \
            ! -name 'unified-import-v8.test.js' \
            ! -name 'v9-real-reports.test.js' \
            -print | sort)
          node --test $TEST_FILES

      - name: Verify excluded tests are fixture-only
        run: |
          test ! -e "codex执行包V7/日报表 (1).xlsx"
          test ! -e "codex执行包V8/日报表 (1).xlsx"
          test ! -e "codex执行包V8.1/日报表 (3)(1).xls"
          echo "Fixture-dependent tests excluded because repository does not contain their source Excel files."

      - name: Commit patch
        run: |
          git config user.name "ChatGPT V22"
          git config user.email "actions@users.noreply.github.com"
          git add server.js src/lightweightDashboardStore.js src/lightweightDashboardSummary.js src/rangeDashboardStore.js src/periodExporter.js public/app.js public/index.html public/style.css
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "V22 final range accuracy and runtime validation"
          git push origin HEAD:chatgpt/v22-memory-safe-dashboard
