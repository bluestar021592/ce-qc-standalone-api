name: V22 Memory Safe Dashboard Patch

on:
  push:
    branches:
      - chatgpt/v22-memory-safe-dashboard
    paths:
      - .github/workflows/v22-memory-safe-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v22-memory-safe-dashboard
          fetch-depth: 0

      - name: Patch server dashboard read paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('server.js')
          text = path.read_text(encoding='utf-8')

          store_import = "import { loadLightweightAggregateState, loadLightweightUnifiedBusinessState } from './src/lightweightDashboardStore.js';"
          summary_import = "import { summarizeLightweightCcslState, summarizeLightweightShopeeState } from './src/lightweightDashboardSummary.js';"
          if store_import not in text:
              anchor = "import { completeUnifiedSnapshot, getLatestUnifiedImport, getUnifiedProcessingQueue, listUnifiedImportHistory, loadUnifiedBusinessState, loadUnifiedPeriodBusinessState, saveUnifiedImport, updateCarryoverResults } from './src/unifiedImportStore.js';"
              if anchor not in text:
                  raise SystemExit('Missing unified store import anchor')
              text = text.replace(anchor, anchor + '\n' + store_import, 1)
          if summary_import not in text:
              text = text.replace(store_import, store_import + '\n' + summary_import, 1)

          state_route = (
              "app.get('/api/state', async (req, res) => {\n"
              "  const state = loadLightweightAggregateState('CCSL');\n"
              "  const summary = summarizeLightweightCcslState(state, {\n"
              "    dbStatus: getDbStatus(),\n"
              "    network: buildNetworkInfo(getRuntimeConfig()),\n"
              "    shopCodes: getShopCodeSummary()\n"
              "  });\n"
              "  res.json({ ok: true, state: req.query.compact === '1' ? compactDashboardState(summary) : summary });\n"
              "});"
          )
          text, count = re.subn(
              r"app\.get\('/api/state', async \(req, res\) => \{.*?\n\}\);(?=\n\napp\.get\('/api/unified-history')",
              lambda _: state_route,
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Cannot patch /api/state')

          shopee_route = (
              "app.get('/api/shopee/state', async (req, res) => {\n"
              "  const state = loadLightweightAggregateState('SHOPEE');\n"
              "  const summary = summarizeLightweightShopeeState(state, { dbStatus: getDbStatus() });\n"
              "  res.json({ ok: true, state: req.query.compact === '1' ? compactDashboardState(summary) : summary });\n"
              "});"
          )
          text, count = re.subn(
              r"app\.get\('/api/shopee/state', async \(req, res\) => \{.*?\n\}\);(?=\n\napp\.get\('/api/business-state/:businessType')",
              lambda _: shopee_route,
              text,
              count=1,
              flags=re.S
          )
          if count != 1:
              raise SystemExit('Cannot patch /api/shopee/state')

          old_loader = "const source = loadUnifiedBusinessState(req.params.businessType, String(req.query.snapshotId || ''));"
          new_loader = "const source = loadLightweightUnifiedBusinessState(req.params.businessType, String(req.query.snapshotId || ''));"
          if old_loader in text:
              text = text.replace(old_loader, new_loader, 1)
          elif new_loader not in text:
              raise SystemExit('Cannot patch business state loader')

          old_workspace = "if (snapshotId) states = ['CE', 'TBKH', 'ALI1688', 'SHOPEECN', 'SHOPEEVN'].map(type => loadUnifiedBusinessState(type, snapshotId));"
          new_workspace = "if (snapshotId) states = ['CE', 'TBKH', 'ALI1688', 'SHOPEECN', 'SHOPEEVN'].map(type => loadLightweightUnifiedBusinessState(type, snapshotId));"
          if old_workspace in text:
              text = text.replace(old_workspace, new_workspace, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Static validation
        run: |
          node --check server.js
          node --check src/lightweightDashboardStore.js
          node --check src/lightweightDashboardSummary.js
          grep -q "summarizeLightweightCcslState(state" server.js
          grep -q "summarizeLightweightShopeeState(state" server.js
          grep -q "loadLightweightUnifiedBusinessState(req.params.businessType" server.js
          grep -q "2026-08-08-v22-memory-safe-dashboard" server.js

      - name: Commit patch
        run: |
          git config user.name "ChatGPT V22"
          git config user.email "actions@users.noreply.github.com"
          git add server.js src/lightweightDashboardStore.js src/lightweightDashboardSummary.js
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "V22 eliminate snapshot JSON from dashboard GET paths"
          git push origin HEAD:chatgpt/v22-memory-safe-dashboard
