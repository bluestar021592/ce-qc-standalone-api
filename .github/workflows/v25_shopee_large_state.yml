name: V25 SHOPEE Large State Fix

on:
  push:
    branches:
      - chatgpt/v25-shopee-large-state-fix-20260808
    paths:
      - .github/workflows/v25_shopee_large_state.yml
      - .github/scripts/v25_shopee_large_state_fix.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v25-shopee-large-state-fix-20260808
          fetch-depth: 0

      - name: Apply V25 patch
        run: python3 .github/scripts/v25_shopee_large_state_fix.py

      - name: Static validation
        run: |
          node --check src/businessStore.js
          node --check src/analyzer.js
          node --check src/pipeline.js
          node --check test/v25-shopee-large-state.test.js

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: V25 targeted regression
        run: node --test test/v25-shopee-large-state.test.js

      - name: Run runnable project tests
        shell: bash
        run: |
          TEST_FILES=$(find test -maxdepth 1 -name '*.test.js' \
            ! -name 'unified-import-v7.test.js' \
            ! -name 'unified-import-v8.test.js' \
            ! -name 'v9-real-reports.test.js' \
            -print | sort)
          node --test $TEST_FILES

      - name: Commit V25 product changes
        run: |
          git config user.name "ChatGPT V25"
          git config user.email "actions@users.noreply.github.com"
          git add src/businessStore.js src/analyzer.js src/pipeline.js test/v25-shopee-large-state.test.js
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "V25 fix SHOPEE oversized state persistence"
          git push origin HEAD:chatgpt/v25-shopee-large-state-fix-20260808
