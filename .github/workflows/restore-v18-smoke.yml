name: CE QC restored V18 smoke

on:
  push:
    branches:
      - chatgpt/restore-final-v18-app
      - chatgpt/restore-final-v18-clean
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        shell: pwsh
        run: |
          node --check bootstrap.js
          node --check server.js
          node --check public/app.js
          node --check src/db.js
          node --check src/store.js
          node --check src/shopWhitelist.js
          node --check src/shopCodes.js
          node --check src/storeFlow.js
          node --check src/unifiedExcelParser.js
          node --check src/unifiedImportStore.js
          node --check src/scanTerminal.js
          node --check src/analyzer.js
          node --check src/pipeline.js
          node --check src/shopeeAnalyzer.js
          node --check src/shopeeTemplateExporter.js
          node --check src/reporting.js
          foreach ($file in @('Start_CE_QC.ps1','tools/CE_QC_Managed_Launcher.ps1','tools/CE_QC_Start.ps1')) {
            $null = [scriptblock]::Create((Get-Content -Raw $file))
          }
          $managedCmd = Get-Content -Raw Start_CE_QC.cmd
          if (-not $managedCmd.Contains('tools\CE_QC_Managed_Launcher.ps1')) { throw 'Managed CMD wrapper lost CE_QC_Managed_Launcher.ps1 ownership' }
          $updateBat = Get-Content -Raw CE_QC_Start.bat
          if (-not $updateBat.Contains('tools\CE_QC_Start.ps1')) { throw 'Verified update BAT lost CE_QC_Start.ps1 ownership' }
          $updateLauncher = Get-Content -Raw tools/CE_QC_Start.ps1
          if (-not $updateLauncher.Contains('Start_CE_QC.ps1')) { throw 'Verified updater no longer hands off to protected Start_CE_QC.ps1 runtime' }

      - name: Verify locked UI signature
        shell: pwsh
        run: |
          $html = Get-Content -Raw public/index.html
          foreach ($needle in @('homeBusinessCards','homeCoreMetrics','homeShopeeSpecial','homeDispatchDistribution','综合日报导入','管理汇总 + 五业务')) {
            if (-not $html.Contains($needle)) { throw "Missing V18 UI signature: $needle" }
          }
          foreach ($file in @('public/dashboard-v18.js','public/dashboard-v18.css','public/v16-blue-white-colors.css','public/v17-page-lock.css')) {
            if (-not (Test-Path $file)) { throw "Missing locked UI file: $file" }
          }
          $detail = Get-Content -Raw public/detail.html
          if (-not $detail.Contains("params.get('businessType')")) { throw 'Detail page lost business-scope query support' }

      - name: Run isolated self-contained regression tests
        shell: pwsh
        run: |
          $tests = @(
            'test/dashboard-v18.test.js',
            'test/data-purge-large-backup.test.js',
            'test/filename-date-detection.test.js',
            'test/scan-batch-fallback.test.js',
            'test/shopee-accounting-dispatch-day.test.js',
            'test/shopee-cnvn.test.js',
            'test/shopee-latest-track-classification.test.js',
            'test/shopee-pv-open-disposition.test.js',
            'test/shopee-template-export.test.js',
            'test/store-flow.test.js',
            'test/store-load-detail.test.js',
            'test/unified-snapshot-membership.test.js',
            'test/user-account-management.test.js',
            'test/v10-pending-and-exclusivity.test.js',
            'test/v11-terminal-isolation-return.test.js',
            'test/v12-business-rule-hardening.test.js',
            'test/v13-unified-import-hardening.test.js',
            'test/v13-export-link-region-hardening.test.js',
            'test/v14-pod-lock-carryover.test.js',
            'test/v9-period-range.test.js',
            'test/v9-special-nodes.test.js'
          )
          foreach ($test in $tests) {
            Write-Host "=== V18 regression: $test ==="
            $safeName = ($test -replace '[^A-Za-z0-9_.-]', '_')
            $stdout = Join-Path $env:RUNNER_TEMP ($safeName + '.stdout.log')
            $stderr = Join-Path $env:RUNNER_TEMP ($safeName + '.stderr.log')
            Remove-Item -LiteralPath $stdout,$stderr -Force -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath 'node.exe' -ArgumentList @('--test','--test-force-exit',$test) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $deadline = (Get-Date).AddSeconds(90)
            while (-not $proc.HasExited -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 250
              $proc.Refresh()
            }
            if (-not $proc.HasExited) {
              cmd /c "taskkill /PID $($proc.Id) /T /F" | Out-Null
              Write-Host "--- stdout: $test ---"
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Write-Host "--- stderr: $test ---"
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              throw "V18 regression timed out after 90 seconds: $test"
            }
            $proc.Refresh()
            Write-Host "--- stdout: $test ---"
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
            Write-Host "--- stderr: $test ---"
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            if ($proc.ExitCode -ne 0) { throw "V18 regression failed with exit code $($proc.ExitCode): $test" }
          }

      - name: Note external-fixture tests
        shell: pwsh
        run: |
          Write-Host 'The following historical tests require local Codex workbook fixtures that were never committed to Git and are intentionally excluded from CI:'
          Write-Host ' - unified-import-v7.test.js'
          Write-Host ' - unified-import-v8.test.js'
          Write-Host ' - v9-real-reports.test.js'
          Write-Host 'Production import behavior will be revalidated with the user real daily workbook after local startup is restored.'

      - name: Start launcher and verify protected local app
        shell: pwsh
        env:
          CI: 'true'
          DATA_DIR: ${{ runner.temp }}\ce-qc-data
          DB_FILE: ${{ runner.temp }}\ce-qc-data\ce_qc_monitor.db
        run: |
          $launcher = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','Start_CE_QC.ps1' -WorkingDirectory $PWD -PassThru -RedirectStandardOutput launcher.out.log -RedirectStandardError launcher.err.log
          try {
            $ready = $false
            $status = 0
            foreach ($i in 1..75) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:5177/' -UseBasicParsing -TimeoutSec 3
                $status = [int]$response.StatusCode
                if ($status -ge 200 -and $status -lt 500) { $ready = $true; break }
              } catch {
                try {
                  if ($_.Exception.Response) {
                    $status = [int]$_.Exception.Response.StatusCode
                    if ($status -ge 200 -and $status -lt 500) { $ready = $true; break }
                  }
                } catch {}
              }
              if ($launcher.HasExited) { break }
            }
            if (-not $ready) { throw 'Restored local web application did not become reachable on 5177.' }

            try {
              $health = Invoke-WebRequest 'http://127.0.0.1:5177/api/health' -UseBasicParsing -TimeoutSec 10
              $healthStatus = [int]$health.StatusCode
            } catch {
              $healthStatus = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            }
            if ($healthStatus -notin @(200,401)) { throw "Unexpected /api/health status: $healthStatus" }

            Write-Host "Local app reachable with HTTP $status; protected health status=$healthStatus"
          }
          finally {
            if ($launcher -and -not $launcher.HasExited) { cmd /c "taskkill /PID $($launcher.Id) /T /F" | Out-Null }
            Write-Host '--- launcher stdout ---'
            Get-Content launcher.out.log -ErrorAction SilentlyContinue
            Write-Host '--- launcher stderr ---'
            Get-Content launcher.err.log -ErrorAction SilentlyContinue
            Write-Host '--- startup log ---'
            Get-Content logs\startup_latest.log -ErrorAction SilentlyContinue
            Write-Host '--- startup error ---'
            Get-Content logs\startup_error.log -ErrorAction SilentlyContinue
          }
