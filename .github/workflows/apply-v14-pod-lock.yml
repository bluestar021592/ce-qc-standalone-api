name: Apply V14 POD lock carry hardening

on:
  push:
    branches:
      - chatgpt/v18-pod-lock-carry-hardening-20260807

permissions:
  contents: write

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v18-pod-lock-carry-hardening-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply POD/return terminal lock patch
        run: node scripts/apply-v14-pod-lock.mjs
      - name: Syntax check
        run: node --check src/unifiedImportStore.js
      - name: Run V14 and dependent carry tests
        run: node --test test/v14-pod-lock-carryover.test.js test/unified-snapshot-membership.test.js test/v12-business-rule-hardening.test.js
      - name: Verify V18 UI unchanged
        shell: pwsh
        run: |
          $html = Get-Content -Raw public/index.html
          foreach ($needle in @('homeBusinessCards','homeCoreMetrics','homeShopeeSpecial','homeDispatchDistribution')) {
            if (-not $html.Contains($needle)) { throw "Locked V18 UI signature missing: $needle" }
          }
      - name: Commit tested source only
        shell: pwsh
        run: |
          git config user.name "ChatGPT QC Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add src/unifiedImportStore.js
          git commit -m "[skip ci] Preserve POD and completed-return locks across daily imports"
          git push origin HEAD:chatgpt/v18-pod-lock-carry-hardening-20260807
