name: V26 Stability Performance

on:
  push:
    branches:
      - chatgpt/v26-stability-performance-20260808
    paths:
      - .github/workflows/v26_stability_performance.yml
      - .github/scripts/v26_stability_performance_fix.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v26-stability-performance-20260808
          fetch-depth: 0

      - name: Apply V26 patch
        run: python3 .github/scripts/v26_stability_performance_fix.py

      - name: Static validation
        run: |
          node --check server.js
          node --check src/businessStore.js
          node --check src/pipeline.js
          node --check public/app.js
          node --check test/v26-stability-performance.test.js

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: V26 targeted regression
        run: node --test test/v26-stability-performance.test.js

      - name: Run runnable project tests
        shell: bash
        run: |
          TEST_FILES=$(find test -maxdepth 1 -name '*.test.js' \
            ! -name 'unified-import-v7.test.js' \
            ! -name 'unified-import-v8.test.js' \
            ! -name 'v9-real-reports.test.js' \
            -print | sort)
          node --test $TEST_FILES

      - name: Commit V26 product changes
        run: |
          git config user.name "ChatGPT V26"
          git config user.email "actions@users.noreply.github.com"
          git add server.js src/businessStore.js src/pipeline.js public/app.js test/v26-stability-performance.test.js
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "V26 stabilize processing and dashboard loading"
          git push origin HEAD:chatgpt/v26-stability-performance-20260808
