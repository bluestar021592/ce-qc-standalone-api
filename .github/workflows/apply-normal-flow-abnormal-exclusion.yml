name: Apply normal-flow abnormal exclusion

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-normal-flow-abnormal-exclusion.mjs'
      - '.github/workflows/apply-normal-flow-abnormal-exclusion.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-normal-flow-abnormal-exclusion.mjs
      - name: Commit normal-flow exclusions
        shell: bash
        run: |
          if git diff --quiet -- src/reporting.js src/rangeDashboardStoreV31.js; then
            echo 'normal-flow exclusions already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/reporting.js src/rangeDashboardStoreV31.js
          git commit -m 'Exclude normal return and store flows from abnormal totals'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
