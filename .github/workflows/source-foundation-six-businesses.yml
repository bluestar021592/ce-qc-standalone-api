name: Source foundation six-business regression

on:
  pull_request:
    paths:
      - 'server.js'
      - 'src/unifiedExcelParser.js'
      - 'src/unifiedImportStore.js'
      - 'src/lightweightDashboardStore.js'
      - 'src/rangeDashboardStoreV31.js'
      - 'src/rangeDashboardStoreLegacy.js'
      - 'public/app.js'
      - 'public/dashboard-v18.js'
      - 'test/unified-import-v7.test.js'
      - 'test/unified-import-ceaf.test.js'
      - 'test/source-six-business-persistence.test.js'
      - 'test/ceaf-processing-routing.test.js'
      - 'test/ceaf-ui-routing.test.js'
      - '.github/workflows/source-foundation-six-businesses.yml'
  workflow_dispatch:

jobs:
  source-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run six-business source, processing and UI tests
        run: node --test test/unified-import-v7.test.js test/unified-import-ceaf.test.js test/source-six-business-persistence.test.js test/ceaf-processing-routing.test.js test/ceaf-ui-routing.test.js
