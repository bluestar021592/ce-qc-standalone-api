name: V24 Dashboard Cache Engine

on:
  push:
    branches:
      - chatgpt/v24-dashboard-cache-engine-20260808
    paths:
      - .github/workflows/v24_dashboard_cache.yml
      - .github/scripts/v24_dashboard_cache_patch.py
      - src/dashboardCacheWorker.js

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v24-dashboard-cache-engine-20260808
          fetch-depth: 0

      - name: Apply V24 product patch
        run: python3 .github/scripts/v24_dashboard_cache_patch.py

      - name: Static validation
        run: |
          node --check server.js
          node --check src/rangeDashboardStore.js
          node --check src/dashboardCacheWorker.js
          grep -q 'dashboard_daily_cache' src/rangeDashboardStore.js
          grep -q 'TEN_MINUTE_REFRESH' server.js
          grep -q 'startDashboardCacheScheduler' server.js
          grep -q 'SHOPEE_RUN_COMPLETED' server.js
          grep -q 'CCSL_RUN_COMPLETED' server.js

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Cache schema runtime smoke
        env:
          DATA_DIR: /tmp/ce-qc-v24-smoke
          DB_FILE: /tmp/ce-qc-v24-smoke/v24-smoke.db
        run: |
          rm -rf /tmp/ce-qc-v24-smoke
          node --input-type=module <<'NODE'
          const mod = await import('./src/rangeDashboardStore.js');
          const status1 = mod.getDashboardCacheStatus();
          if (status1.schemaVersion !== '2026-08-08-v24') throw new Error('wrong cache schema version');
          if (!mod.markDashboardCacheDirty('2026-08-08','SMOKE')) throw new Error('dirty marker failed');
          const result = mod.refreshDashboardCacheDirty({ limit: 4, recentDays: 2 });
          const status2 = mod.getDashboardCacheStatus();
          if (status2.dirtyDates < 1) throw new Error('dirty date should remain until a completed snapshot exists');
          console.log({ status1, result, status2 });
          const { closeDb } = await import('./src/db.js');
          closeDb();
          NODE

      - name: Run runnable project tests
        shell: bash
        run: |
          TEST_FILES=$(find test -maxdepth 1 -name '*.test.js' \
            ! -name 'unified-import-v7.test.js' \
            ! -name 'unified-import-v8.test.js' \
            ! -name 'v9-real-reports.test.js' \
            -print | sort)
          node --test $TEST_FILES

      - name: Commit V24 product changes
        run: |
          git config user.name "ChatGPT V24"
          git config user.email "actions@users.noreply.github.com"
          git add server.js src/store.js src/rangeDashboardStore.js src/dashboardCacheWorker.js
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "V24 add persistent dashboard cache engine"
          git push origin HEAD:chatgpt/v24-dashboard-cache-engine-20260808
