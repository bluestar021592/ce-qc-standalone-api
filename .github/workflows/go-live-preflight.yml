name: CE QC go-live preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ce-qc-golive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-live-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Critical syntax checks
        run: |
          node --check src/trajectoryFacts.js
          node --check src/analyzerV30.js
          node --check src/analyzerFinal.js
          node --check src/analyzer.js
          node --check src/shopeeAnalyzer.js
          node --check src/unifiedImportStore.js
          node --check src/rangeDashboardStore.js
          node --check src/dataPurge.js
          node --check src/v505PurgeCoordinator.js
          node --check src/v29EndpointAliasPatch.js
          node --check scripts/CE_QC_PurgePrepareTaskWorker.mjs
          node --check scripts/CE_QC_PurgeExecuteTaskWorker.mjs
          node --check public/v505-data-purge-recovery.js
          node --check scripts/CE_QC_Production_Audit.mjs
          node --check scripts/CE_QC_Production_Diagnostic_ReadOnly.mjs
      - name: Go-live regression suite
        run: npm run test:golive
      - name: Final state-machine regression
        run: node --test test/v400-seven-business-completion-loader.test.js test/final-system-state-machine.test.js test/final-analyzer-facade.test.js test/final-store-direct-inbound.test.js test/final-range-shopee.test.js test/trajectory-facts.test.js test/trajectory-facts-analyzer-integration.test.js test/pending-fact-continuity-analyzer.test.js test/normal-flow-abnormal-exclusion.test.js
