name: CE QC V31 dashboard consistency

on:
  pull_request:
    branches:
      - main

jobs:
  dashboard-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax checks
        run: |
          node --check src/rangeDashboardStore.js
          node --check src/rangeDashboardStoreLegacy.js
          node --check src/rangeDashboardStoreV31.js
          node --check test/v31-dashboard-snapshot-consistency.test.js
      - name: Latest snapshot regression
        run: node --test test/v31-dashboard-snapshot-consistency.test.js
