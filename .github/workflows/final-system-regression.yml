name: CE QC final system regression

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  final-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check src/shopWhitelistBuiltin.js
          node --check src/shopWhitelist.js
          node --check src/shopCodes.js
          node --check src/storeFlow.js
          node --check src/trajectoryFacts.js
          node --check src/analyzerV30.js
          node --check src/analyzerFinal.js
          node --check src/analyzer.js
          node --check src/shopeeAnalyzerV30.js
          node --check src/shopeeAnalyzerV31.js
          node --check src/reporting.js
          node --check src/rangeDashboardStoreFinal.js
          node --check src/rangeDashboardStore.js
          node --check src/v231MetricTruthUiInjectionPatch.js
          node --check src/v235DashboardCurrentCache.js
          node --check src/v236DashboardCurrentRead.js
          node --check src/v236DashboardCurrentRoutePatch.js
          node --check src/v237DashboardTrendRead.js
          node --check src/dashboardCacheWorker.js
          node --check public/v58-drilldown-runtime.js
          node --check public/v234-dashboard-live.js
          node --check public/v235-cache-ready-reload.js
          node --check public/v237-dashboard-owner-guard.js
          node --check scripts/v237-dashboard-owner-source-smoke.cjs
          node --check scripts/CE_QC_Production_Audit.mjs
      - name: V237 exact dashboard current, region and trend smoke
        run: node scripts/v235-dashboard-cache-smoke.mjs
      - name: V237 single dashboard owner source smoke
        run: node scripts/v237-dashboard-owner-source-smoke.cjs
      - name: Final state-machine regression
        run: node --test test/final-system-state-machine.test.js test/final-analyzer-facade.test.js test/final-store-direct-inbound.test.js test/final-range-shopee.test.js test/trajectory-facts.test.js test/trajectory-facts-analyzer-integration.test.js test/pending-fact-continuity-analyzer.test.js test/normal-flow-abnormal-exclusion.test.js
