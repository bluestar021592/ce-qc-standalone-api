name: Apply analysis coverage UI patch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/apply-analysis-coverage-ui-patch.mjs'
      - '.github/workflows/apply-analysis-coverage-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-analysis-coverage-ui-patch.mjs
      - name: Commit analysis coverage UI
        shell: bash
        run: |
          if git diff --quiet -- public/app.js; then
            echo 'analysis coverage UI already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Show source versus analyzed coverage in range dashboards'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
