name: V788 Real Edge Pilot
# Real Windows Edge UI validation for the *candidate* only, using a disposable
# temporary database and mock local administrator. No real CE login or D: reads.
on:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'public/**'
      - 'scripts/v788-real-admin-edge-pilot.mjs'
      - 'scripts/v788-*.mjs'
      - 'tools/CE_QC_V788_隔离试用.ps1'
      - '.github/workflows/v788-real-edge-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-edge-real-pilot:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Isolated candidate pilot launcher syntax and fail-closed invariant
        shell: pwsh
        run: |
          $path = Resolve-Path 'tools/CE_QC_V788_隔离试用.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path.Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          node --check scripts/v788-create-isolated-pilot-snapshot.mjs
          node --check scripts/v788-edge-synthetic-evidence-fixture.mjs
          node --check scripts/v788-real-admin-edge-pilot.mjs
          node scripts/v788-isolated-pilot-safety-smoke.mjs
      - name: Real Edge V788 admin status panel, no CE TMS
        shell: pwsh
        run: node scripts/v788-real-admin-edge-pilot.mjs
      - name: Start and stop actual V788 pilot in disposable Windows CI
        shell: pwsh
        env:
          CE_QC_V788_PILOT_CI_NO_BROWSER: '1'
          CE_QC_V788_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $env:NODE_ENV='test'
          node --input-type=module -e "import {createV788SyntheticEvidence} from './scripts/v788-edge-synthetic-evidence-fixture.mjs';createV788SyntheticEvidence()"
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic isolated fixture setup failed' }
          try {
            & pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'tools/CE_QC_V788_隔离试用.ps1' -ExpectedSha $env:CE_QC_V788_CANDIDATE_SHA -CandidateRef 'v788-board-calibration'
            if ($LASTEXITCODE -ne 0) { throw 'Real isolated V788 pilot launcher did not start/stop correctly' }
          } finally {
            node --input-type=module -e "import {deleteV788SyntheticEvidence} from './scripts/v788-edge-synthetic-evidence-fixture.mjs';deleteV788SyntheticEvidence()"
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic isolated fixture cleanup failed' }
          }
          if (Test-Path 'D:\CE_QC_V788_试用沙盒') { throw 'V788 pilot sandbox was not removed after shutdown' }
          Write-Host '[V788_PILOT_E2E] PASS candidate startup, isolated DB, trial web endpoint, and clean shutdown'
