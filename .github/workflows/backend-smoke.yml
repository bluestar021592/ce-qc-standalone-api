name: CE QC backend smoke

on:
  push:
    branches:
      - chatgpt/fix-startup-backend-20260807
      - chatgpt/fix-node-path-20260807
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        shell: pwsh
        run: |
          node --check bootstrap.js
          node --check server.js
          node --check src/db.js
          node --check src/store.js
          $null = [scriptblock]::Create((Get-Content -Raw Start_CE_QC.ps1))

      - name: Start through Windows launcher and verify core pages
        shell: pwsh
        env:
          HOST: 127.0.0.1
          PORT: 5177
          DATA_DIR: ${{ runner.temp }}\ce-qc-data
          DB_FILE: ${{ runner.temp }}\ce-qc-data\ce_qc_monitor.db
        run: |
          $launcher = Start-Process "$env:ComSpec" -ArgumentList '/d','/c','Start_CE_QC.cmd' -WorkingDirectory $PWD -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            foreach ($i in 1..40) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:5177/api/health' -TimeoutSec 3
                if ($health.ok) { $ready = $true; break }
              } catch {}
            }

            if (-not $ready) {
              Get-Content logs\startup_latest.log -ErrorAction SilentlyContinue
              throw 'Windows launcher did not bring the backend up on port 5177.'
            }

            $state = Invoke-RestMethod 'http://127.0.0.1:5177/api/state' -TimeoutSec 10
            if (-not $state.ok) { throw '/api/state returned ok=false' }

            $settings = Invoke-WebRequest 'http://127.0.0.1:5177/settings' -UseBasicParsing -TimeoutSec 10
            if ($settings.StatusCode -ne 200) { throw '/settings did not return HTTP 200' }
          }
          finally {
            if ($launcher -and -not $launcher.HasExited) {
              cmd /c "taskkill /PID $($launcher.Id) /T /F" | Out-Null
            }
            Get-Content logs\startup_latest.log -ErrorAction SilentlyContinue
          }
