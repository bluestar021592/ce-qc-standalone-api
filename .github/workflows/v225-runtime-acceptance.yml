name: CE QC V225 runtime acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: V225 source + local-db gate
        run: node scripts/v224-persisted-bootstrap-recovery-smoke.cjs
      - name: V225 real HTTP runtime acceptance
        run: node scripts/v225-runtime-e2e.mjs
