name: V24.1 Dashboard Cache Warmup

on:
  push:
    branches:
      - chatgpt/v24-1-cache-warmup-20260808
    paths:
      - .github/workflows/v24_1_cache_warmup.yml
      - .github/scripts/v24_1_cache_warmup_patch.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v24-1-cache-warmup-20260808
          fetch-depth: 0

      - name: Apply V24.1 warmup patch
        run: python3 .github/scripts/v24_1_cache_warmup_patch.py

      - name: Static validation
        run: |
          node --check src/rangeDashboardStore.js
          node --check src/dashboardCacheWorker.js
          grep -q 'warmDashboardCacheRange' src/rangeDashboardStore.js
          grep -q "days: 180" src/dashboardCacheWorker.js

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Warmup runtime smoke
        env:
          DATA_DIR: /tmp/ce-qc-v24-1-smoke
          DB_FILE: /tmp/ce-qc-v24-1-smoke/v24-1-smoke.db
        run: |
          rm -rf /tmp/ce-qc-v24-1-smoke
          node --input-type=module <<'NODE'
          const mod = await import('./src/rangeDashboardStore.js');
          const result = mod.warmDashboardCacheRange({ days: 180 });
          if (Number(result.warmed || 0) !== 0) throw new Error('empty smoke DB should warm zero dates');
          const { closeDb } = await import('./src/db.js');
          closeDb();
          console.log(result);
          NODE

      - name: Run runnable project tests
        shell: bash
        run: |
          TEST_FILES=$(find test -maxdepth 1 -name '*.test.js' \
            ! -name 'unified-import-v7.test.js' \
            ! -name 'unified-import-v8.test.js' \
            ! -name 'v9-real-reports.test.js' \
            -print | sort)
          node --test $TEST_FILES

      - name: Commit V24.1 product changes
        run: |
          git config user.name "ChatGPT V24.1"
          git config user.email "actions@users.noreply.github.com"
          git add src/rangeDashboardStore.js src/dashboardCacheWorker.js
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "V24.1 prewarm historical dashboard cache"
          git push origin HEAD:chatgpt/v24-1-cache-warmup-20260808
