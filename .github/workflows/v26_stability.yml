name: V26 Stability Fix

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/v26_stability_fix.py
      - .github/workflows/v26_stability.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply V26 patch
        run: python3 .github/scripts/v26_stability_fix.py
      - name: Static validation
        run: |
          node --check src/pipeline.js
          node --check server.js
          node --check public/app.js
          node --check test/v26-stability.test.js
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: V26 targeted tests
        run: node --test test/v26-stability.test.js
      - name: Run project regression tests
        shell: bash
        run: |
          TEST_FILES=$(find test -maxdepth 1 -name '*.test.js' \
            ! -name 'unified-import-v7.test.js' \
            ! -name 'unified-import-v8.test.js' \
            ! -name 'v9-real-reports.test.js' \
            -print | sort)
          node --test $TEST_FILES
      - name: Commit product changes
        run: |
          git config user.name "ChatGPT V26"
          git config user.email "actions@users.noreply.github.com"
          git add src/pipeline.js server.js public/app.js test/v26-stability.test.js
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "V26 stabilize dashboard startup and unified reconciliation"
          git pull --rebase origin main
          git push origin main
