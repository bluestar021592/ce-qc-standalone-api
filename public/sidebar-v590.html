<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CE QC Sidebar V590</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;background:#0b365d}
body{color:#b8dcff}
.sidebar{position:relative;width:100%;height:100vh;background:linear-gradient(180deg,#0b365d 0%,#0b3b67 100%);padding:10px 10px 58px}
.brand{height:60px;display:flex;align-items:center;gap:10px;padding:0 4px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{width:80px;height:46px;object-fit:contain;background:#fff;border-radius:5px;padding:3px}
.brand-copy{min-width:0}
.brand-title{font-size:16px;font-weight:700;color:#fff;white-space:nowrap}
.brand-sub{margin-top:3px;font-size:10px;color:#a6c4df;white-space:nowrap}
.nav{padding-top:10px}
.nav a{height:40px;display:flex;align-items:center;gap:12px;padding:0 14px;margin:2px 0;border-radius:6px;color:#a9d5ff;text-decoration:none;font-size:15px;font-weight:700;line-height:1;cursor:pointer;user-select:none}
.nav a:hover{background:rgba(37,126,255,.18);color:#fff}
.nav a.active{background:#1f80ff;color:#fff;box-shadow:0 4px 14px rgba(0,82,180,.25)}
.icon{width:18px;height:18px;flex:0 0 18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.collapse{position:absolute;left:10px;right:10px;bottom:10px;height:40px;border:1px solid rgba(255,255,255,.18);border-radius:6px;background:rgba(255,255,255,.05);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.collapse:hover{background:rgba(255,255,255,.09)}
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">
    <img class="brand-logo" src="/assets/ce-express-logo-main.png" alt="CE EXPRESS">
    <div class="brand-copy"><div class="brand-title">CE EXPRESS</div><div class="brand-sub">质量控制管理系统</div></div>
  </div>
  <nav class="nav" id="nav">
    <a data-page="home" href="/?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-home"></use></svg><span>首页总看板</span></a>
    <a data-page="ce" href="/ce?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-package"></use></svg><span>CE看板</span></a>
    <a data-page="ceaf" href="/ceaf?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-package"></use></svg><span>CEAF空运看板</span></a>
    <a data-page="tbkh" href="/tbkh?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-package"></use></svg><span>TBKH看板</span></a>
    <a data-page="ali1688" href="/ali1688?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-package"></use></svg><span>ALI1688看板</span></a>
    <a data-page="whpp" href="/whpp?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-package"></use></svg><span>WHPP本土看板</span></a>
    <a data-page="shopeecn" href="/shopeecn?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-bag"></use></svg><span>SHOPEE CN看板</span></a>
    <a data-page="shopeevn" href="/shopeevn?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-bag"></use></svg><span>SHOPEE VN看板</span></a>
    <a data-page="import" href="/import?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-database"></use></svg><span>数据导入</span></a>
    <a data-page="tracking" href="/tracking?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-route"></use></svg><span>轨迹查询</span></a>
    <a data-page="exceptions" href="/exceptions?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-alert"></use></svg><span>异常明细</span></a>
    <a data-page="reports" href="/reports?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-clipboard"></use></svg><span>报表导出</span></a>
    <a data-page="data-management" href="/data-management?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-database"></use></svg><span>数据管理</span></a>
    <a data-page="settings" href="/settings?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-settings"></use></svg><span>系统设置</span></a>
    <a data-page="logs" href="/logs?auth=v581" target="_top"><svg class="icon"><use href="/assets/ui-icons.svg#icon-clipboard"></use></svg><span>操作日志</span></a>
  </nav>
  <button class="collapse" id="collapse" type="button">‹ <span>收起菜单</span></button>
</div>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const active=String(q.get('active')||'home');
  const nav=document.getElementById('nav');
  for(const a of nav.querySelectorAll('a[data-page]')){
    a.classList.toggle('active',a.dataset.page===active);
    try{
      const u=new URL(a.getAttribute('href'),location.origin);
      for(const [k,v] of q){
        if(k==='active')continue;
        if(k==='t')continue;
        u.searchParams.set(k,v);
      }
      u.searchParams.set('auth','v581');
      a.href=u.pathname+'?'+u.searchParams.toString();
    }catch{}
  }
  document.getElementById('collapse').addEventListener('click',()=>{
    try{parent.postMessage({type:'CE_QC_V590_TOGGLE_SIDEBAR'},location.origin);}catch{}
  });
})();
</script>
</body>
</html>
