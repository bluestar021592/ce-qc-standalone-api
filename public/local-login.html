<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CE EXPRESS 质量控制管理系统</title>
<style>
:root{
  font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;
  color:#123554;
  --blue:#1677f2;
  --blue-dark:#0d5fc8;
  --line:#dbe7f3;
  --muted:#7b8da1;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e8f2fc}
body{min-height:100vh;overflow:hidden}
.login-stage{
  position:relative;min-height:100vh;display:grid;place-items:center;
  background:
    linear-gradient(110deg,rgba(8,56,98,.76),rgba(18,97,164,.28) 44%,rgba(255,255,255,.05) 68%),
    radial-gradient(circle at 78% 22%,rgba(255,255,255,.95),rgba(255,255,255,0) 27%),
    linear-gradient(180deg,#d9ebfb 0%,#c8e1f6 38%,#adcfe9 100%);
}
.login-stage:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(160deg,transparent 0 56%,rgba(21,79,124,.13) 56% 57%,transparent 57%),
    repeating-linear-gradient(90deg,transparent 0 88px,rgba(255,255,255,.15) 88px 89px),
    linear-gradient(180deg,transparent 0 66%,rgba(16,60,96,.16) 66% 67%,transparent 67%);
}
.scene-brand{
  position:absolute;left:7.5%;top:50%;transform:translateY(-50%);
  color:#fff;width:min(420px,34vw);z-index:1;
}
.scene-brand .eyebrow{font-size:14px;letter-spacing:2.5px;font-weight:700;opacity:.9}
.scene-brand h1{font-size:42px;line-height:1.1;margin:12px 0 14px;letter-spacing:.5px}
.scene-brand p{margin:0;font-size:15px;line-height:1.9;opacity:.86;max-width:360px}
.scene-lines{margin-top:28px;display:grid;gap:9px}
.scene-lines span{display:block;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,0));}
.scene-lines span:nth-child(1){width:72%}.scene-lines span:nth-child(2){width:55%}.scene-lines span:nth-child(3){width:34%}
.scene-air{
  position:absolute;left:11%;bottom:16%;width:260px;height:88px;opacity:.42;
}
.scene-air:before{
  content:"";position:absolute;left:42px;top:28px;width:165px;height:16px;background:#fff;border-radius:16px 80px 24px 16px;transform:rotate(-7deg);
}
.scene-air:after{
  content:"";position:absolute;left:98px;top:20px;width:80px;height:11px;background:#fff;transform:rotate(-28deg);border-radius:9px;
}
.scene-ground{
  position:absolute;left:0;right:0;bottom:0;height:21%;
  background:linear-gradient(180deg,rgba(12,54,89,.12),rgba(8,43,72,.32));
  clip-path:polygon(0 20%,18% 0,39% 20%,62% 3%,82% 18%,100% 4%,100% 100%,0 100%);
}
.login-card{
  position:relative;z-index:5;width:min(380px,calc(100vw - 40px));
  margin-left:min(28vw,440px);
  background:rgba(255,255,255,.97);
  border:1px solid rgba(206,220,234,.9);
  border-radius:10px;
  padding:34px 36px 30px;
  box-shadow:0 24px 60px rgba(18,61,102,.23);
  backdrop-filter:blur(12px);
}
.login-logo{display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.login-logo img{width:154px;height:auto;max-height:54px;object-fit:contain}
.login-card h2{margin:0;text-align:center;font-size:21px;color:#143859}
.login-card .sub{text-align:center;margin:7px 0 24px;color:#7a8da1;font-size:12px}
.field{position:relative;margin-bottom:14px}
.field svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#8ca0b4}
.field input{
  width:100%;height:44px;border:1px solid #d5e0ec;border-radius:6px;
  padding:0 13px 0 40px;color:#183b5a;background:#fff;outline:none;font-size:13px;
  transition:border-color .15s,box-shadow .15s;
}
.field input:focus{border-color:#6daef9;box-shadow:0 0 0 3px rgba(22,119,242,.10)}
.login-options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:3px 0 18px;font-size:11px;color:#6d8094}
.remember{display:inline-flex;align-items:center;gap:6px;cursor:pointer}.remember input{accent-color:var(--blue)}
.forgot{border:0;background:transparent;color:#3777bc;padding:0;cursor:pointer;font-size:11px}
.login-button{
  width:100%;height:44px;border:0;border-radius:6px;
  background:linear-gradient(180deg,#2185ff,#116fe6);color:#fff;
  font-size:14px;font-weight:700;box-shadow:0 8px 18px rgba(22,119,242,.20);
  cursor:pointer;
}
.login-button:hover{background:linear-gradient(180deg,#167bf5,#0d66d5)}
.login-button:disabled{opacity:.62;cursor:wait}
.error{min-height:20px;margin-top:12px;color:#c23a3a;text-align:center;font-size:11px;line-height:1.6}
.version{text-align:center;color:#9aa8b7;font-size:10px;margin-top:12px}
@media(max-width:900px){
  .scene-brand{display:none}
  .login-card{margin-left:0}
}
@media(max-width:520px){
  .login-card{padding:30px 24px}
}
</style>
</head>
<body>
<main class="login-stage">
  <section class="scene-brand" aria-hidden="true">
    <div class="eyebrow">CE EXPRESS · QUALITY CONTROL</div>
    <h1>质量控制管理系统</h1>
    <p>聚合各业务板块质量数据，统一追踪派送、异常、POD与日常运营状态。</p>
    <div class="scene-lines"><span></span><span></span><span></span></div>
  </section>
  <div class="scene-air" aria-hidden="true"></div>
  <div class="scene-ground" aria-hidden="true"></div>

  <section class="login-card">
    <div class="login-logo">
      <img src="/assets/ce-express-logo-main.png" alt="CE EXPRESS">
    </div>
    <h2>欢迎登录</h2>
    <p class="sub">CE EXPRESS 质量控制管理系统</p>

    <form id="login">
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <input name="username" id="username" autocomplete="username" placeholder="请输入账号" required autofocus>
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <input name="password" id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      </div>

      <div class="login-options">
        <label class="remember"><input id="rememberUser" type="checkbox">记住账号</label>
        <button class="forgot" id="forgot" type="button">忘记密码?</button>
      </div>

      <button class="login-button" type="submit">登录</button>
      <div id="error" class="error" role="alert"></div>
      <div class="version">CE EXPRESS · QC SYSTEM</div>
    </form>
  </section>
</main>

<script>
(function(){
  const form=document.getElementById('login');
  const err=document.getElementById('error');
  const username=document.getElementById('username');
  const remember=document.getElementById('rememberUser');

  try{
    const saved=localStorage.getItem('ce_qc_login_user')||'';
    if(saved){username.value=saved;remember.checked=true;}
  }catch{}

  document.getElementById('forgot').addEventListener('click',function(){
    err.textContent='请联系系统管理员重置登录密码。';
  });

  form.addEventListener('submit',async function(event){
    event.preventDefault();
    const btn=form.querySelector('button[type="submit"]');
    btn.disabled=true;
    err.textContent='正在登录…';
    const data=Object.fromEntries(new FormData(form).entries());

    try{
      if(remember.checked)localStorage.setItem('ce_qc_login_user',data.username||'');
      else localStorage.removeItem('ce_qc_login_user');
    }catch{}

    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8000);
    try{
      const host=location.hostname||'127.0.0.1';
      const response=await fetch('http://'+host+':5179/api/local-auth/login',{
        method:'POST',credentials:'include',cache:'no-store',
        headers:{'content-type':'application/json','accept':'application/json'},
        body:JSON.stringify(data),signal:controller.signal
      });
      const text=await response.text();let payload={};
      try{payload=text?JSON.parse(text):{};}catch{payload={error:text||('HTTP '+response.status)};}
      if(!response.ok)throw new Error(payload.error||'登录失败');
      location.replace('/?auth=v625&t='+Date.now());
    }catch(error){
      err.textContent=error&&error.name==='AbortError'
        ?'登录认证超时，请确认启动器保持开启。'
        :(error.message||'登录失败');
      btn.disabled=false;
    }finally{clearTimeout(timer);}
  });
})();
</script>
</body>
</html>
