<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CE QC Next 登录</title><link rel="stylesheet" href="/style.css"></head><body><main class="login-page"><section class="login-box"><h1>CE质控系统</h1><p>QC Next · 全新架构，不再经过旧版5179→5177会话接管链。</p><form id="form"><div class="field"><label>用户名</label><input id="username" autocomplete="username" required></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div><button id="submit" class="btn primary" type="submit">登录</button><div id="status" class="status"></div></form></section></main><script>const f=document.getElementById('form'),s=document.getElementById('status'),b=document.getElementById('submit');f.addEventListener('submit',async e=>{e.preventDefault();if(b.disabled)return;b.disabled=true;b.textContent='正在登录…';s.className='status';s.textContent='正在直接验证内部账号…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:document.getElementById('password').value})});const p=await r.json();if(!r.ok||!p.ok)throw new Error(p.error||'登录失败');s.className='status ok';s.textContent='登录成功，正在进入系统…';location.replace('/');}catch(err){s.className='status error';s.textContent=err.message||String(err);b.disabled=false;b.textContent='登录';}});</script></body></html>
